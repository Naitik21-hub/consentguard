[project]
name = "consentguard"
version = "1.0.0"
description = "ConsentGuard: understand what you are agreeing to."
requires-python = ">=3.12"
# Runtime dependencies for hosted deployment (tests use requirements.txt).
dependencies = [
    "streamlit>=1.65,<2",
    "anthropic>=1.12,<2",
    "pydantic>=2.13,<3",
    "pypdf>=6.19,<7",
]

[tool.vercel]
entrypoint = "vercel_app:app"
